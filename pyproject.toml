[project]
name = "sts_rl"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy", "gymnasium", "torch>=2.0,<3", "cloudpickle>=3,<4"]

[project.optional-dependencies]
dev = ["ruff==0.15.22", "black==26.5.1", "mypy==2.3.0", "pytest"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
