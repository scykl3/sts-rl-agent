[project]
name = "sts_rl"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy", "gymnasium", "torch>=2.0,<3"]

[project.optional-dependencies]
# Development tooling: test runner, linter, formatter, and type checker.
dev = ["pytest", "ruff", "black", "mypy"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100
target-version = ["py310"]
